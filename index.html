<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心灵疗愈助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 加载画面（短暂展示后进入聊天） -->
  <div id="setup-screen" class="screen">
    <div class="setup-card">
      <div class="logo">🌱</div>
      <h1>心灵疗愈助手</h1>
      <p class="subtitle">一个温柔倾听、慢慢陪伴的对话伙伴</p>
      <div class="setup-info" style="margin-top:24px;">
        <p>正在加载知识库……</p>
      </div>
    </div>
  </div>

  <!-- 对话页面 -->
  <div id="chat-screen" class="screen hidden">
    <div id="header">
      <div class="header-left">
        <span class="logo-small">🌱</span>
        <span class="header-title">心灵疗愈助手</span>
      </div>
      <div class="header-center">
        <span id="sync-status" class="sync-status" title="本地同步状态">⚪ 离线</span>
      </div>
      <div class="header-right">
        <button id="summary-btn" onclick="generateSummary()" title="总结对话">📝</button>
        <button id="history-btn" onclick="showHistory()" title="对话历史">📋</button>
      </div>
    </div>

    <div id="chat-container">
      <div id="messages">
        <div class="message assistant">
          <div class="avatar">🤗</div>
          <div class="bubble">
            你好，我是这里陪你聊天的助手。<br>
            不管你此刻遇到了什么，都可以和我说。<br>
            我会先好好听，不着急给建议。<br><br>
            你想从哪里开始？
          </div>
        </div>
      </div>
      <div id="loading" class="hidden">
        <div class="dot-pulse"></div>
        <span>思考中……</span>
      </div>
    </div>

    <div id="input-area">
      <textarea id="user-input" rows="1" placeholder="说说你的感受……" onkeydown="handleKeyDown(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 对话总结弹窗 -->
  <div id="summary-modal" class="modal hidden">
    <div class="modal-content summary-content">
      <span class="close" onclick="closeSummary()">&times;</span>
      <h2>📝 对话精华总结</h2>
      <div id="summary-text">
        <p>点击按钮生成这段对话的总结，有价值的点可以存入知识库。</p>
      </div>
      <div id="summary-loading" class="hidden">正在总结……</div>
      <button id="copy-summary-btn" onclick="copySummary()" class="hidden">复制总结</button>
    </div>
  </div>

  <!-- 历史记录弹窗 -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-content history-content">
      <span class="close" onclick="closeHistory()">&times;</span>
      <div class="history-tabs">
        <button class="history-tab active" onclick="showHistoryTab('conversations')">📋 对话记录</button>
        <button class="history-tab" onclick="showHistoryTab('summaries')">📝 自动总结</button>
      </div>
      <div id="history-conversations">
        <div id="history-list"></div>
        <div id="history-detail" class="hidden"></div>
      </div>
      <div id="history-summaries" class="hidden"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
